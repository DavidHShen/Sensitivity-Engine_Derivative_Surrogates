name: smoke-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax checks
        run: |
          python -m py_compile SEDS.py
          python -m py_compile scripts/validate_inputs.py

      - name: Deterministic mock smoke test
        run: bash scripts/run_smoke.sh
